name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # After build so the stdio end-to-end test (skipped without dist/) runs too.
      - run: npm test

  # Build (never push) on every PR so a Dockerfile regression is caught before a tag.
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: retroachievements-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and serves /healthz
        run: |
          docker run -d --name ra -p 8080:8080 -e RA_API_KEY=dummy -e MCP_ALLOWED_HOSTS=localhost retroachievements-mcp:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs ra; exit 1
